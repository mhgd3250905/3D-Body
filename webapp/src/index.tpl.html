<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlareLab 网页版 · 托马斯训练助手</title>
<meta name="description" content="托马斯训练助手（FlareLab）网页版：3D 慢放托马斯全旋八个阶段，暂停点选肌群，51 个针对性训练、组次计时、学习路径与本地记录。">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="/img/icon.png">
<link rel="preload" href="/fonts/nsc-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"FL Display";src:url(/fonts/anton.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"FL Sans";src:url(/fonts/nsc-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"FL Sans";src:url(/fonts/nsc-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"FL Mono";src:url(/fonts/mono.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --bg:#0a0a0c;--bg1:#0f0f12;--bg2:#141418;--bg3:#1b1b20;--bg4:#24242a;
  --ink:#f3f1ec;--ink2:#c9c7c1;--mute:#8b8a90;--dim:#5a595f;
  --ember:#ff6a3d;--ember2:#ff8a5c;--ember-d:rgba(255,106,61,.14);--ember-l:rgba(255,106,61,.28);
  --ok:#7fd8a6;--warn:#ffc46b;
  --hair:rgba(255,255,255,.08);--hair2:rgba(255,255,255,.15);
  --disp:"FL Display","Anton","Impact","Arial Narrow","FL Sans",sans-serif;
  --sans:"FL Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"FL Mono",ui-monospace,Menlo,"FL Sans",monospace;
  --rail:236px;--insp:400px;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:6px}
::selection{background:var(--ember);color:#000}
.mono{font-family:var(--mono);letter-spacing:.06em}
.disp{font-family:var(--disp);letter-spacing:.01em;font-weight:400}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.eyebrow b{color:var(--ember);font-weight:400}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;height:100dvh}
.rail{background:var(--bg1);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:22px 14px 16px;gap:6px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{display:block;font-family:var(--disp);font-size:20px;letter-spacing:.04em;line-height:1}
.brand span{display:block;font-size:11px;color:var(--mute);margin-top:4px;letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink2);position:relative;transition:background .2s,color .2s}
.nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a .t{font-size:14px}
.nav a .en{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.nav a .kbd{display:none}
@media (hover:hover){.nav a:hover{background:var(--bg3);color:var(--ink)}}
.nav a.on{background:linear-gradient(90deg,var(--ember-d),rgba(255,106,61,.03));color:var(--ink)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--ember)}
.nav a.on svg{stroke:var(--ember);opacity:1}
.nav a .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ember);color:#160700;font-size:11px;font-weight:700;display:grid;place-items:center}
.nav a .badge+.en{display:none}
.rail .sep{height:1px;background:var(--hair);margin:14px 8px}
.weekcard{margin:auto 4px 10px;padding:14px;border:1px solid var(--hair);border-radius:12px;background:var(--bg2)}
.weekcard .row{display:flex;justify-content:space-between;align-items:baseline}
.weekcard .big{font-family:var(--disp);font-size:28px;line-height:1}
.weekcard .big small{font-size:14px;color:var(--mute);margin-left:3px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.dots i{height:22px;border-radius:5px;background:var(--bg4);font-style:normal;font-size:9.5px;color:var(--dim);display:grid;place-items:center;font-family:var(--mono)}
.dots i.on{background:var(--ember);color:#1a0700}
.dots i.today{box-shadow:inset 0 0 0 1px var(--ember)}
.rail-foot{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--mute)}
.rail-foot a,.rail-foot button{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:8px;text-align:left}
.rail-foot a:hover,.rail-foot button:hover{background:var(--bg3);color:var(--ink)}
.rail-foot svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
kbd{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--hair2);border-bottom-width:2px;color:var(--ink2);background:var(--bg3)}

.main{position:relative;min-width:0;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none;min-height:0}
.view.on{display:grid}
.scroll{overflow:auto;min-height:0}
.page{padding:40px clamp(24px,3.4vw,56px) 80px;max-width:1500px;margin:0 auto;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.ph h1{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin-top:8px}
.ph h1 .disp{font-size:.62em;color:var(--dim);margin-left:12px;letter-spacing:.04em;font-weight:400}
.ph p{color:var(--mute);max-width:640px;margin-top:6px}

/* ---------- buttons/chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;background:var(--bg3);border:1px solid var(--hair2);font-size:13.5px;font-weight:700;white-space:nowrap;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{background:var(--bg4);border-color:rgba(255,255,255,.25)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#1a0700}
.btn.pri:hover{background:var(--ember2)}
.btn.ghost{background:transparent}
.btn.sm{height:32px;padding:0 13px;font-size:12.5px}
.btn.lg{height:50px;padding:0 26px;font-size:15px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.done{background:rgba(127,216,166,.12);border-color:rgba(127,216,166,.35);color:var(--ok)}
.btn[disabled]{opacity:.4;pointer-events:none}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--hair);border-radius:999px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;color:var(--mute);white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--bg4);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair2)}
.seg.ember button.on{background:var(--ember);color:#1a0700;box-shadow:none;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--hair2);font-size:12px;color:var(--ink2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ember));flex:none}
button.chip:hover{border-color:var(--ember);color:var(--ink)}
.tier{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--bg4);color:var(--ink)}
.tier.A{background:#ff6a3d;color:#1a0700}.tier.B{background:#ffb38f;color:#1a0700}.tier.C{background:#f3f1ec;color:#111}
.side{font-size:11px;color:var(--ember);border:1px solid var(--ember-l);padding:0 7px;border-radius:999px;height:20px;display:inline-flex;align-items:center;white-space:nowrap}
.note{font-size:12px;color:var(--dim);line-height:1.6}
.card{background:var(--bg2);border:1px solid var(--hair);border-radius:var(--r)}
.empty{padding:48px 24px;text-align:center;color:var(--mute);border:1px dashed var(--hair2);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ---------- watch ---------- */
.watch{grid-template-columns:1fr var(--insp)}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#121216 0%,#0a0a0c 60%)}
.stage canvas.gl,.mstage canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.stage.dragging canvas.gl{cursor:grabbing}
.st-top{position:absolute;left:32px;top:28px;pointer-events:none;max-width:60%}
.st-top .num{font-family:var(--disp);font-size:92px;line-height:.86;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.22)}
.st-top h2{font-size:30px;font-weight:700;margin-top:10px;line-height:1.2}
.st-top .en{font-family:var(--disp);font-size:16px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.st-top .tags{display:flex;gap:8px;margin-top:12px;pointer-events:auto}
.st-tools{position:absolute;right:20px;top:22px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,24,.7);border:1px solid var(--hair2);backdrop-filter:blur(8px)}
.iconbtn:hover{border-color:var(--ember)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{background:var(--ember);color:#1a0700;border-color:var(--ember)}
.toggle{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 14px 0 10px;border-radius:999px;background:rgba(20,20,24,.72);border:1px solid var(--hair2);backdrop-filter:blur(8px);font-size:12.5px}
.toggle .sw{width:30px;height:18px;border-radius:9px;background:var(--bg4);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#bbb;transition:transform .2s,background .2s}
.toggle.on .sw{background:var(--ember)}.toggle.on .sw::after{transform:translateX(12px);background:#fff}
.st-tools .seg{background:rgba(20,20,24,.72);backdrop-filter:blur(8px)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:148px;font-size:12px;color:var(--mute);background:rgba(10,10,12,.6);padding:6px 12px;border-radius:999px;border:1px solid var(--hair);pointer-events:none;white-space:nowrap;transition:opacity .3s}
.minimap{position:absolute;left:24px;bottom:146px;width:200px;height:226px;border-radius:14px;background:rgba(16,16,20,.78);border:1px solid var(--hair);backdrop-filter:blur(10px);overflow:hidden}
.minimap header{position:absolute;left:12px;top:9px;right:12px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.minimap .lbl{position:absolute;bottom:7px;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.14em;z-index:2;pointer-events:none}
.minimap .mstage{position:absolute;inset:26px 0 18px 0}
.mstage{position:relative}
.mstage canvas.gl{cursor:pointer}
.controls{position:absolute;left:20px;right:20px;bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:14px 16px 12px 14px;border-radius:18px;background:rgba(16,16,20,.82);border:1px solid var(--hair);backdrop-filter:blur(14px)}
.play{width:46px;height:46px;border-radius:50%;background:var(--ember);color:#1a0700;display:grid;place-items:center;flex:none;box-shadow:0 6px 24px rgba(255,106,61,.35);transition:transform .15s}
.play:hover{transform:scale(1.05)}
.play svg{width:20px;height:20px;fill:currentColor}
.tl{order:-1;flex-basis:100%;min-width:0;position:relative}
.tl .segs{display:flex;gap:3px;height:34px;cursor:pointer}
.tl .segs button{position:relative;height:100%;border-radius:6px;background:var(--bg3);overflow:hidden;text-align:left;padding:0 8px;display:flex;flex-direction:column;justify-content:center;min-width:0;transition:background .2s}
.tl .segs button:hover{background:var(--bg4)}
.tl .segs button b{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:400;line-height:1.1}
.tl .segs button span{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.tl .segs button.on{background:var(--ember-d);box-shadow:inset 0 0 0 1px var(--ember-l)}
.tl .segs button.on b{color:var(--ember)}.tl .segs button.on span{color:var(--ink)}
.tl .segs button .fill{position:absolute;left:0;bottom:0;height:2px;background:var(--ember);width:0}
.tl .ph-head{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;border-radius:2px;box-shadow:0 0 10px rgba(255,255,255,.6);pointer-events:none}
.tread{font-family:var(--mono);font-size:12px;color:var(--mute);width:62px;text-align:right;flex:none}
.tread b{color:var(--ink);font-weight:400}
.cnow{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.cnow b{color:var(--ink);font-weight:400;margin-right:8px}.cnow .lp{color:var(--ember);margin-left:8px}
.ctl-r{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.ctl-r .seg button{padding:0 10px;font-family:var(--mono);font-size:11.5px}
.loader{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .5s}
.loader .ring{width:56px;height:56px;border-radius:50%;border:2px solid var(--bg4);border-top-color:var(--ember);animation:spin 1s linear infinite}
.loader p{margin-top:14px;font-size:12px;color:var(--mute);text-align:center}
.ready .loader{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.gl-failed .loader .ring{display:none}

/* ---------- inspector ---------- */
.insp{background:var(--bg1);border-left:1px solid var(--hair);overflow:auto;min-height:0}
.insp-in{padding:26px 26px 40px}
.insp h3{font-size:22px;font-weight:700;line-height:1.25}
.insp .cap{color:var(--ink2);margin-top:12px;font-size:13.5px;line-height:1.75}
.insp .sec{margin-top:26px}
.insp .sec>.eyebrow{display:flex;justify-content:space-between;margin-bottom:12px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 14px 12px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--hair);text-align:left;transition:border-color .2s,background .2s}
.mrow:hover{border-color:var(--hair2);background:var(--bg3)}
.mrow .bar{display:block;width:4px;align-self:stretch;min-height:28px;border-radius:2px;background:var(--c)}
.mrow b{font-size:14px;display:block}
.mrow p{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.55}
.mrow .side{align-self:start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);margin-bottom:18px}
.back:hover{color:var(--ink)}
.ghead{display:flex;gap:14px;align-items:flex-start}
.ghead .sw{width:6px;align-self:stretch;border-radius:3px;background:var(--c)}
.why{padding:14px 16px;border-radius:12px;background:var(--ember-d);border:1px solid var(--ember-l);font-size:13.5px;line-height:1.7}
.why.off{background:var(--bg2);border-color:var(--hair);color:var(--mute)}
.phlist{display:flex;flex-wrap:wrap;gap:6px}
.phlist button{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--hair);font-size:12px;color:var(--ink2)}
.phlist button b{font-family:var(--mono);font-weight:400;color:var(--ember);font-size:11px}
.phlist button.s b{color:var(--dim)}
.phlist button:hover{border-color:var(--ember)}
.dmini+.dmini{margin-top:8px}
.dmini{display:grid;grid-template-columns:80px minmax(0,1fr);gap:14px;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--hair);text-align:left;width:100%;transition:border-color .2s}
.dmini:hover{border-color:var(--hair2)}
.dmini img{width:80px;height:80px;border-radius:9px;object-fit:cover;background:#111}
.dmini b{font-size:14px;display:block;line-height:1.35}
.dmini .en{font-size:11.5px;color:var(--dim)}
.dmini .rx{font-size:12px;color:var(--ink2);margin-top:6px}
.dmini .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tiertabs{display:flex;gap:4px;margin-bottom:10px}

/* ---------- muscles ---------- */
.muscles{grid-template-columns:280px 1fr var(--insp)}
.glist{background:var(--bg1);border-right:1px solid var(--hair);overflow:auto;padding:26px 16px 30px}
.glist h4{display:flex;align-items:baseline;gap:8px;font-size:13px;margin:18px 10px 8px}
.glist h4 span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.glist button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;color:var(--ink2);text-align:left}
.glist button i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.glist button em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.glist button:hover{background:var(--bg3);color:var(--ink)}
.glist button.on{background:var(--bg3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair2)}
.mbig{position:relative;min-width:0;min-height:0;background:radial-gradient(90% 70% at 50% 45%,#16161b 0%,#0a0a0c 70%)}
.mbig .mstage{position:absolute;inset:0}
.mbig .mstage canvas.gl{cursor:grab}
.mbig .st-tools{top:22px}
.mbig .st-top .num{font-size:72px}
.mbig .legend{position:absolute;left:28px;bottom:26px;display:flex;gap:16px;font-size:12px;color:var(--mute)}
.mbig .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- library ---------- */
.lib{grid-template-columns:1fr}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px;position:sticky;top:0;z-index:5;padding:14px 0;background:linear-gradient(var(--bg) 75%,rgba(10,10,12,0))}
.search{position:relative;flex:1;min-width:240px;max-width:380px}
.search input{width:100%;height:40px;border-radius:999px;background:var(--bg2);border:1px solid var(--hair2);padding:0 44px 0 40px;outline:none}
.search input:focus{border-color:var(--ember)}
.search svg{position:absolute;left:14px;top:12px;width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:1.8}
.search kbd{position:absolute;right:12px;top:10px}
select.sel{height:40px;border-radius:999px;background:var(--bg2);border:1px solid var(--hair2);padding:0 34px 0 16px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dcard{display:flex;flex-direction:column;border-radius:var(--r);background:var(--bg2);border:1px solid var(--hair);overflow:hidden;text-align:left;transition:transform .25s,border-color .25s,box-shadow .25s}
.dcard:hover{transform:translateY(-3px);border-color:var(--hair2);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.dcard .im{position:relative;aspect-ratio:1/1;background:#0d0d10;overflow:hidden}
.dcard .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.dcard:hover .im img{transform:scale(1.04)}
.dcard .im .tier{position:absolute;left:12px;top:12px}
.dcard .im .ok{position:absolute;right:12px;top:12px;height:22px;padding:0 8px;border-radius:6px;background:rgba(127,216,166,.16);color:var(--ok);font-size:11px;display:flex;align-items:center}
.dcard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.dcard .g{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mute)}
.dcard .g i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.dcard b{font-size:15px;line-height:1.35}
.dcard .en{font-size:11.5px;color:var(--dim)}
.dcard .rx{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--ink2)}.dcard .rx .diff{flex:none}
.diff{display:inline-flex;gap:3px}.diff i{width:5px;height:12px;border-radius:2px;background:var(--bg4)}.diff i.on{background:var(--ember)}
.count{font-family:var(--mono);font-size:12px;color:var(--mute)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:var(--bg1);border-left:1px solid var(--hair2);z-index:41;transform:translateX(102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--hair)}
.drawer .db{overflow:auto;flex:1}
.drawer .hero{position:relative;aspect-ratio:16/11;background:#0d0d10;overflow:hidden}
.drawer .hero img{width:100%;height:100%;object-fit:cover}
.drawer .hero::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,var(--bg1))}
.drawer .dc{padding:4px 28px 28px}
.drawer h2{font-size:26px;line-height:1.25;margin-top:6px}
.drawer .en{color:var(--mute);font-family:var(--disp);letter-spacing:.05em;font-size:15px;text-transform:uppercase}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.kv div{padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--hair)}
.kv span{display:block;font-size:11px;color:var(--mute);margin-bottom:2px}
.kv b{font-size:13.5px}
.blk{margin-top:22px}
.blk h4{font-size:12px;color:var(--mute);font-weight:400;margin-bottom:8px;letter-spacing:.06em}
.blk ol{list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:8px}
.blk ol li{counter-increment:c;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;line-height:1.65}
.blk ol li::before{content:counter(c,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--ember);padding-top:3px}
.blk p{font-size:14px;line-height:1.7;color:var(--ink2)}
.blk.warn p{color:#ffd2bf}
.drawer .df{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--hair);background:var(--bg1)}
.drawer .df .btn{flex:1}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.modal .sheet{position:relative;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--bg1);border:1px solid var(--hair2);border-radius:22px;padding:34px;box-shadow:0 40px 120px rgba(0,0,0,.6);transform:translateY(16px);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.modal.on .sheet{transform:none}
.modal .bg{position:absolute;inset:0;background:rgba(5,5,7,.7);backdrop-filter:blur(6px)}

/* onboarding */
.welcome .sheet{width:min(920px,100%);display:grid;grid-template-columns:1.05fr 1fr;padding:0;overflow:hidden}
.welcome .art{position:relative;background:#0c0c0f;min-height:520px;overflow:hidden}
.welcome .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.welcome .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,var(--bg1)),linear-gradient(transparent 60%,rgba(10,10,12,.8))}
.welcome .art .mark{position:absolute;left:28px;bottom:26px;z-index:2}
.welcome .txt{padding:46px 44px 38px;display:flex;flex-direction:column}
.welcome h1{font-size:44px;line-height:1.1;margin:14px 0 10px;font-weight:700}
.welcome .lead{color:var(--ink2);font-size:15px}
.steps{display:flex;flex-direction:column;gap:12px;margin:28px 0}
.steps div{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center}
.steps b{font-family:var(--disp);font-size:20px;color:var(--ember)}
.welcome .acts{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.rules{display:flex;flex-direction:column;gap:12px;margin:22px 0 26px}
.rules div{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:16px;border-radius:14px;background:var(--bg2);border:1px solid var(--hair)}
.rules b{font-family:var(--disp);font-size:24px;color:var(--ember);line-height:1}
.rules p{font-weight:700;font-size:15px}
.rules span{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.assess .q{padding:16px 0;border-top:1px solid var(--hair)}
.assess .q h4{font-size:14px;margin-bottom:10px}
.assess .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.assess .opts button{padding:10px 8px;border-radius:10px;background:var(--bg2);border:1px solid var(--hair);font-size:12px;color:var(--ink2);line-height:1.35}
.assess .opts button b{display:block;font-size:13px;color:var(--ink)}
.assess .opts button.on{border-color:var(--ember);background:var(--ember-d)}

/* ---------- timer ---------- */
.timer{position:fixed;inset:0;z-index:70;background:radial-gradient(80% 70% at 50% 45%,#16120f 0%,#0a0a0c 70%);display:none;grid-template-columns:minmax(300px,420px) 1fr;grid-template-rows:auto 1fr auto}
.timer.on{display:grid}
.timer .th{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--hair)}
.timer .th h2{font-size:18px}
.timer .th .en{color:var(--dim);font-size:12px}
.timer .th .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
.timer .tl2{padding:28px;border-right:1px solid var(--hair);overflow:auto}
.timer .tl2 img{width:100%;border-radius:16px;aspect-ratio:1/1;object-fit:cover;background:#111}
.timer .tc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px}
.ringwrap{position:relative;width:min(46vh,420px);aspect-ratio:1/1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:6}
.ringwrap .bgc{stroke:var(--bg4)}
.ringwrap .fgc{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ringwrap.rest .fgc{stroke:#8fc7ff}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringwrap .st{font-size:15px;color:var(--ink2);letter-spacing:.1em}
.ringwrap .val{font-family:var(--disp);font-size:clamp(80px,13vh,140px);line-height:1;margin:6px 0}
.ringwrap .sub{font-family:var(--mono);font-size:12px;color:var(--mute)}
.setdots{display:flex;gap:8px}.setdots i{width:30px;height:5px;border-radius:3px;background:var(--bg4)}.setdots i.on{background:var(--ember)}.setdots i.cur{background:var(--ember2);opacity:.6}
.tacts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.timer .tf{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-top:1px solid var(--hair);font-size:12px;color:var(--mute)}
.pain{color:#ff9b86;border-color:rgba(255,120,100,.35)!important}

/* ---------- today / path / progress / settings ---------- */
.trow{display:grid;grid-template-columns:72px 1fr auto;gap:18px;align-items:center;padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--hair)}
.trow img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.trow b{font-size:15px}
.trow .meta{font-size:12.5px;color:var(--mute);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.trow .acts{display:flex;gap:8px}
.tlist{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.tile{padding:20px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--hair)}
.tile span{font-size:12px;color:var(--mute)}
.tile b{display:block;font-family:var(--disp);font-size:44px;line-height:1.05;margin-top:6px;font-weight:400}
.tile b small{font-size:15px;color:var(--mute);margin-left:4px;font-family:var(--sans)}
.panel{padding:22px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--hair)}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:26px}
.stepper button{position:relative;text-align:left;padding:16px 16px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--hair);transition:border-color .2s}
.stepper button:hover{border-color:var(--hair2)}
.stepper button .n{font-family:var(--disp);font-size:34px;line-height:1;color:var(--dim)}
.stepper button b{display:block;font-size:14px;margin-top:8px}
.stepper button span{font-size:11.5px;color:var(--mute)}
.stepper button .st{position:absolute;right:12px;top:14px;font-size:10.5px;padding:0 8px;height:20px;border-radius:999px;display:flex;align-items:center;border:1px solid var(--hair2);color:var(--mute)}
.stepper button.cur .st{border-color:var(--ember);color:var(--ember)}
.stepper button.pass .st{border-color:rgba(127,216,166,.4);color:var(--ok)}
.stepper button.pass .n{color:var(--ok)}
.stepper button.cur .n{color:var(--ember)}
.stepper button.sel{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset;background:linear-gradient(180deg,var(--ember-d),var(--bg2) 70%)}
.stepper button .bar{height:3px;border-radius:2px;background:var(--bg4);margin-top:12px;overflow:hidden}
.stepper button .bar i{display:block;height:100%;background:var(--ember)}
.stepper button.locked{opacity:.55}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lesson{padding:20px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--hair);display:flex;flex-direction:column;gap:12px}
.lesson.done{border-color:rgba(127,216,166,.3)}
.lesson .lh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lesson .lh b{font-size:16px;line-height:1.35}
.lesson .lh .mono{font-size:11px;color:var(--mute)}
.lesson .dl{display:flex;flex-direction:column;gap:6px}
.lesson .dl button{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;background:var(--bg3);text-align:left;font-size:12.5px}
.lesson .dl button img{width:38px;height:38px;border-radius:7px;object-fit:cover}
.lesson .dl button:hover{background:var(--bg4)}
.lesson .foot{margin-top:auto;display:flex;gap:8px}
.gate{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--bg2);border:1px solid var(--hair);cursor:pointer;margin-top:10px}
.gate .cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--hair2);display:grid;place-items:center;flex:none}
.gate.on .cb{background:var(--ember);border-color:var(--ember)}
.gate.on .cb::after{content:"";width:9px;height:5px;border-left:2px solid #1a0700;border-bottom:2px solid #1a0700;transform:rotate(-45deg) translate(1px,-1px)}
.gate b{font-size:14px}
.gate span{display:block;font-size:12px;color:var(--mute)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;overflow-x:auto}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--bg4)}
.heat i.l1{background:rgba(255,106,61,.35)}.heat i.l2{background:rgba(255,106,61,.65)}.heat i.l3{background:var(--ember)}
.heat i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wk div{text-align:center;padding:12px 0;border-radius:12px;background:var(--bg3);font-size:12px;color:var(--mute)}
.wk div b{display:block;font-family:var(--disp);font-size:20px;color:var(--dim);font-weight:400;margin-top:2px}
.wk div.on{background:var(--ember-d);box-shadow:inset 0 0 0 1px var(--ember-l);color:var(--ink)}
.wk div.on b{color:var(--ember)}
.wk div.today{box-shadow:inset 0 0 0 1px var(--hair2)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.hrow:first-child{border-top:0}
.hrow b{font-size:14px}
.hrow span{font-size:12px;color:var(--mute)}
.hrow .r{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.flag{font-size:11px;padding:0 7px;height:20px;border-radius:999px;display:inline-flex;align-items:center;margin-left:6px}
.flag.inc{background:var(--bg4);color:var(--mute)}.flag.painf{background:rgba(255,120,100,.14);color:#ff9b86}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.srow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--hair)}
.srow:first-of-type{border-top:0}
.srow b{font-size:14px;font-weight:400}
.srow span{display:block;font-size:12px;color:var(--mute)}
.prose p{color:var(--ink2);font-size:13.5px;line-height:1.75;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#f3f1ec;color:#111;border-radius:999px;padding:10px 12px 10px 20px;font-size:13.5px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .3s;z-index:90;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:700;color:#c43f12;padding:4px 10px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-top:18px}
.keys div{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px;color:var(--ink2)}
.mobile-top{display:none}
.banner{padding:12px 16px;border-radius:12px;background:rgba(255,196,107,.08);border:1px solid rgba(255,196,107,.25);color:#ffd99a;font-size:12.5px;margin-bottom:18px}

/* ---------- responsive ---------- */
@media (max-width:1440px){:root{--insp:368px}}
@media (max-width:1280px){:root{--rail:84px}
  .rail{padding:20px 10px;align-items:center}
  .brand{padding:0 0 20px}.brand div{display:none}
  .nav a{flex-direction:column;gap:4px;padding:10px 6px;width:64px}
  .nav a .t{font-size:11px}.nav a .en,.nav a .badge+.en{display:none}
  .nav a .badge{position:absolute;right:6px;top:4px;min-width:16px;height:16px;font-size:10px;margin:0}
  .nav a.on::before{left:-10px}
  .weekcard,.rail-foot .lab{display:none}
  .rail-foot a,.rail-foot button{justify-content:center}
  .muscles{grid-template-columns:220px 1fr var(--insp)}
  .lessons{grid-template-columns:1fr 1fr}
  .stepper{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:1024px){
  .watch{grid-template-columns:1fr;grid-template-rows:minmax(420px,64vh) auto;overflow:auto}
  .watch .insp{border-left:0;border-top:1px solid var(--hair);overflow:visible}
  .muscles{grid-template-columns:1fr;grid-template-rows:auto minmax(460px,62vh) auto;overflow:auto}
  .glist{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--hair)}
  .glist h4{display:none}.glist button{width:auto;white-space:nowrap;flex:none;border:1px solid var(--hair)}
  .glist button em{display:none}
  .muscles .insp{border-left:0;overflow:visible}
  .two,.sgrid{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .welcome .sheet{grid-template-columns:1fr}.welcome .art{min-height:220px}
}
@media (max-width:760px){
  html,body{font-size:14px}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .mobile-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hair);background:var(--bg1);padding-top:max(10px,env(safe-area-inset-top))}
  .mobile-top img{width:28px;height:28px;border-radius:7px}
  .mobile-top b{font-family:var(--disp);font-size:17px;letter-spacing:.04em}
  .mobile-top span{font-size:11px;color:var(--mute)}
  .mobile-top .r{margin-left:auto;display:flex;gap:6px}
  .rail{grid-row:3;flex-direction:row;padding:6px 6px max(6px,env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--hair);overflow:visible;align-items:stretch}
  .rail .brand,.rail .sep,.rail-foot,.weekcard{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav a{width:auto;flex:1;padding:6px 2px;border-radius:10px}
  .nav a[data-r=settings],.nav a[data-r=muscles]{display:none}
  .nav a.on::before{display:none}
  .page{padding:22px 16px 60px}
  .ph h1{font-size:26px}
  .watch{grid-template-rows:minmax(380px,58vh) auto}
  .st-top{left:16px;top:14px;max-width:70%}.st-top .num{font-size:52px}.st-top h2{font-size:21px;margin-top:6px}.st-top .en{font-size:12px}
  .st-top .tags{margin-top:8px}
  .st-tools{right:12px;top:12px;gap:8px}
  .st-tools .seg{display:none}
  .minimap{display:none}
  .hint{display:none}
  .controls{left:8px;right:8px;bottom:8px;flex-wrap:wrap;gap:8px;padding:10px;border-radius:14px}
  .play{width:44px;height:44px}
  .tl{order:3;flex-basis:100%}
  .tl .segs{height:24px}.tl .segs button span{display:none}.tl .segs button{padding:0;align-items:center}
  .tread{width:auto}
  .cnow{display:none}
  .ctl-r{margin-left:auto}
  .ctl-r .lp{display:none}
  .insp-in{padding:20px 16px 30px}
  .mbig .st-top .num{font-size:44px}
  .toolbar{gap:8px}
  .search{min-width:100%}
  .toolbar .seg{overflow-x:auto;max-width:100%}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .dcard .bd{padding:10px 12px 12px}.dcard b{font-size:13.5px}
  .tiles{gap:10px}.tile{padding:14px}.tile b{font-size:32px}
  .stepper{grid-template-columns:repeat(2,1fr)}
  .lessons{grid-template-columns:1fr}
  .trow{grid-template-columns:56px 1fr;}.trow img{width:56px;height:56px}.trow .acts{grid-column:1/-1}
  .timer{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;overflow:auto}
  .timer .tl2{display:none}
  .timer .th{padding:14px 16px}
  .ringwrap{width:min(78vw,340px)}
  .modal .sheet{padding:24px 20px;border-radius:18px}
  .welcome .txt{padding:26px 22px}
  .welcome h1{font-size:32px}
  .assess .opts{grid-template-columns:repeat(2,1fr)}
  .drawer{width:100vw}
  .keys{grid-template-columns:1fr}
  .kbd-only,.timer .th .en,.search kbd{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="mobile-top"><img src="/img/icon.png" alt=""><div><b>FLARELAB</b><br><span>托马斯训练助手 · 网页版</span></div>
    <div class="r"><a class="iconbtn" href="#/muscles" aria-label="肌群"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M8 21l1.5-7L7 9.5 12 8l5 1.5L14.5 14 16 21"/></svg></a><a class="iconbtn" href="#/settings" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a></div></header>
  <nav class="rail" aria-label="主导航">
    <div class="brand"><img src="/img/icon.png" alt=""><div><b>FLARELAB</b><span>托马斯训练助手 · 网页版</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="weekcard" id="weekcard"></div>
    <div class="rail-foot">
      <button id="keysBtn" type="button"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span class="lab">快捷键 <kbd>?</kbd></span></button>
      <a href="https://flare.uuugk.win/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span class="lab">FlareLab 官网</span></a>
    </div>
  </nav>
  <main class="main" id="main">
    <section class="view watch" id="v-watch">
      <div class="stage" id="stage">
        <div class="loader"><div><div class="ring" style="margin:auto"></div><p id="ldtxt">正在载入 3D 动作 <span class="mono" id="ldpct">0%</span></p></div></div>
        <div class="st-top" id="stTop"></div>
        <div class="st-tools">
          <button class="toggle" id="xrayBtn" type="button" title="肌群高亮 (X)"><span class="sw"></span>肌群高亮</button>
          <div class="seg" id="viewSeg"><button data-v="front">正面</button><button data-v="side">侧面</button><button data-v="back">背面</button><button data-v="reset" title="复位镜头 (R)">复位</button></div>
        </div>
        <div class="minimap" id="minimap"><header><span class="eyebrow"><b>●</b> 同步发力</span><span class="eyebrow">点选</span></header><div class="mstage" id="miniStage"></div><span class="lbl" style="left:40px">正面</span><span class="lbl" style="right:40px">背面</span></div>
        <div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 暂停后点身体选肌群</div>
        <div class="controls">
          <button class="play" id="playBtn" aria-label="播放/暂停 (空格)"></button>
          <div class="tread" id="tread"></div><div class="cnow" id="cnow"></div>
          <div class="tl" id="tl"><div class="segs" id="segs"></div><div class="ph-head" id="phead"></div></div>
          <div class="ctl-r">
            <div class="seg ember" id="speedSeg"></div>
            <button class="iconbtn lp" id="loopBtn" title="循环当前阶段 (L)"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
          </div>
        </div>
      </div>
      <aside class="insp" id="wInsp"></aside>
    </section>
    <section class="view muscles" id="v-muscles">
      <div class="glist" id="glist"></div>
      <div class="mbig" id="mbig">
        <div class="loader"><div><div class="ring" style="margin:auto"></div><p>正在载入肌群人台</p></div></div>
        <div class="mstage" id="bigStage"></div>
        <div class="st-top" id="mTop"></div>
        <div class="st-tools"><div class="seg" id="mViewSeg"><button data-v="front">正面</button><button data-v="side">侧面</button><button data-v="back">背面</button></div></div>
        <div class="legend"><span><i style="background:var(--ember)"></i>当前选择</span><span><i style="background:repeating-linear-gradient(45deg,#a29bfe 0 2px,#555 2px 4px)"></i>深层 · 斜线示意</span><span>拖动旋转 · 点选肌群</span></div>
      </div>
      <aside class="insp" id="mInsp"></aside>
    </section>
    <section class="view lib scroll" id="v-library"></section>
    <section class="view scroll" id="v-today"></section>
    <section class="view scroll" id="v-path"></section>
    <section class="view scroll" id="v-progress"></section>
    <section class="view scroll" id="v-settings"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="训练详情"></aside>
<div class="modal" id="modal"><div class="bg"></div><div class="sheet" id="sheet"></div></div>
<div class="timer" id="timer"></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
