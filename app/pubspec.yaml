name: flare
description: "Offline Flare learning with 3D movement, muscle explanations and practice."
publish_to: 'none'
version: 1.0.13+28

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.6
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.2
  web: 1.1.1
  cupertino_icons: 1.0.8
  characters: 1.4.1
  liquid_glass_widgets: 1.14.0

  # 3.44.7 pins 0.20.2, 3.47.x pins 0.20.3; either toolchain resolves.
  intl: ^0.20.2
  path_provider: 2.1.6
  # Shared SDK packages are pinned to 536b4c5 (tag ugk_trainer-v0.8.0: HipLab sync r1, PR #26).
  ugk_coach:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 536b4c52c0f665203e7feb82dfde4d76f4815ad8
  ugk_trainer_runtime:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 536b4c52c0f665203e7feb82dfde4d76f4815ad8
      path: packages/ugk_trainer_runtime
  ugk_coach_ui:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 536b4c52c0f665203e7feb82dfde4d76f4815ad8
      path: packages/ugk_coach_ui
  ugk_coach_chat:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 536b4c52c0f665203e7feb82dfde4d76f4815ad8
      path: packages/ugk_coach_chat

# Keep SDK transitive dependencies on the same reviewed commit.
dependency_overrides:
  ugk_coach:
    git:
      url: https://github.com/mhgd3250905/ugk-3d-pose-sdk.git
      ref: 536b4c52c0f665203e7feb82dfde4d76f4815ad8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Package data explicitly; retain import/source tools only in the repository.
    - assets/data/phase-muscles.json
    - assets/data/phase-muscles.schema.json
    - assets/data/course-stages.json
    - assets/data/drills.json
    - assets/data/drills.schema.json
    - assets/data/source-manifest.json
    # Pose-Hub PR #26: unreviewed AI tag drafts, kept separate from source data.
    - assets/ai_tags/actions.json
    - assets/coach/
    - assets/trainer_voice/
    - assets/trainer_voice/_common/
    - assets/trainer_voice/_common/voice/zh/
    - assets/trainer_voice/_common/voice/en/
    - assets/trainer_voice/_common/chime/
    - assets/l10n/
    - assets/drills/
    - assets/drills/light/
    # Shared SDK public definitions and posters; videos load on demand.
    - assets/public_media/
    - assets/public_media/catalog/
    - assets/public_posters/
    - assets/public_posters/r2-v11/cover/
    - assets/public_posters/r2-v11/thumbnail/
    - assets/muscles/
    - assets/scene/
    - assets/scene/assets/
    - assets/scene/coach/
    - assets/scene/anatomy/
    - assets/scene/licenses/
    - assets/licenses/
    - assets/brand/icon.png
    - assets/brand/hero-thomas.webp
    - assets/brand/flare-loading.webp
    - assets/brand/flare-loading-still.webp
    - assets/brand/flare-loading-v42-r12.webp
    - assets/brand/flare-loading-v42-r12-still.webp
    - assets/brand/flare-loading-v42-r15.webp
    - assets/brand/flare-loading-v42-r15-still.webp
    - assets/brand/flare-loading-v42-r16.webp
    - assets/brand/flare-loading-v42-r16-still.webp
    - assets/brand/flare-loading-v42-r17.webp
    - assets/brand/flare-loading-v42-r17-still.webp
  fonts:
    - family: FlareSans
      fonts:
        - asset: assets/fonts/FlareSans.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
