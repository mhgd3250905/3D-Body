name: flare
description: "Offline Flare learning with 3D movement, muscle explanations and practice."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.6
  webview_flutter: 4.14.1
  # iOS-only stage settings (bounce, link preview, inspector); same version
  # webview_flutter resolves transitively.
  webview_flutter_wkwebview: 3.26.2
  web: 1.1.1
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Package data explicitly; retain import/source tools only in the repository.
    - assets/data/phase-muscles.json
    - assets/data/phase-muscles.schema.json
    - assets/data/course-stages.json
    - assets/data/drills.json
    - assets/data/drills.schema.json
    - assets/data/source-manifest.json
    - assets/drills/
    - assets/drills/light/
    - assets/scene/
    - assets/scene/assets/
    - assets/scene/coach/
    - assets/scene/anatomy/
    - assets/scene/licenses/
    - assets/licenses/
    - assets/brand/icon.png
    - assets/brand/hero-thomas.webp
  fonts:
    - family: FlareSans
      fonts:
        - asset: assets/fonts/FlareSans.ttf
