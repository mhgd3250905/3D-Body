</style><div class="sheet"><h1>AI 教练对话 · 结构与交互对照</h1><div class="subtitle">逻辑视口 390 × 844 · 第 1 步接入 · 保留各 App 配色</div><div class="row"><div><div class="label">SmartFit · 静态卡片参考</div><img class="screen" id="reference" alt="SmartFit 对话页实际组件渲染"></div><div><div class="label">FlareLab · 本轮实际 Web</div><img class="screen" id="flare" alt="FlareLab 对话页实际 Web 截图"></div></div><div class="note">左：2026-10-23 已保存的 SmartFitApp widget 渲染，非手机截图。右：本轮 Flutter Web 构建，使用固定 SDK 工具响应样例。<br>计划内容遵循各 App 动作范围；本图用于布局对照，不代表原生材质、帧性能或用户验收。</div></div><script>const theme=new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light';document.body.classList.toggle('dark',theme==='dark');document.getElementById('reference').src=`smartfit-${theme}.png`;document.getElementById('flare').src=`flare-${theme}.png`;</script></html>
